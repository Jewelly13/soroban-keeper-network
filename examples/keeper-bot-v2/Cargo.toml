[package]
name = "keeper-bot-v2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Production keeper bot v2 with persistent state and concurrent round processing (epic E15)"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# SDK dependencies — dynamic import handled in code due to ESM
# @stellar/stellar-sdk (in v1 JavaScript version) would go here for Rust SDK

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "keeper-bot-v2"
path = "src/main.rs"
