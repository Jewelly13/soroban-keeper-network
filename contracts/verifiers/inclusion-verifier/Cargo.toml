[package]
name = "inclusion-verifier"
version = "0.1.0"
edition = "2021"
authors = ["Soroban Keeper Network Contributors"]
description = "Reference IKeeperVerifier implementation: confirms a target contract called back into this verifier during the same transaction"
license = "Apache-2.0"
repository = "https://github.com/soroban-tooling/soroban-keeper-network"
keywords = ["soroban", "stellar", "keeper", "verifier"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.1" }
keeper-registry = { path = "../../keeper-registry" }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }

# Note: release profile is defined once at the workspace root Cargo.toml.
# Profiles in non-root packages are ignored by Cargo, so it is not repeated here.
